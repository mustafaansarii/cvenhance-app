version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cvenhance
      POSTGRES_USER: cvenhance
      POSTGRES_PASSWORD: cvenhance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cvenhance-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cvenhance
      DATABASE_USERNAME: cvenhance
      DATABASE_PASSWORD: cvenhance
      AUTH_JWT_SECRET: 8fK2mP9xQ7vL4nR6tY3wZ1aB5cD8eF0g
      AUTH_SERVICE_URL: http://localhost:8081
      PAYMENT_SERVICE_URL: http://localhost:8082
      SUBSCRIPTION_SERVICE_URL: http://localhost:8083
      DOC_SERVICE_URL: http://localhost:8084
      AI_SERVICE_URL: http://localhost:8085
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
    depends_on:
      - postgres

volumes:
  pgdata:
